<!doctype html>
<html lang="en">

<!--

    I didn't end up trying the alert, but the issue was the src file path. The JavaScript files should work now!

-->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI GAME</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/start.css') }}" />

    <!-- Testiong bootstrap code from CS 120-->
    <!-- Bootstrap CDN Code: (I removed the integrity/anonymous attriutes)-->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="top">
        <h1>Title TBD</h1>
        <!-- Professor Porter suggestions: "GPT Your Own Adventure", "Chat Your Own Adventure" -->
    </div>
    <div class="bottom">
        <form action="/begin" method="get">
            <div>
                <label for="story-length">Story Length</label>
                <br>
                <input type="number" name="story-length" value="">
            </div>
            <div>
                <label for="theme">Theme</label>
                <br>
                <input type="text" name="theme" value="" placeholder="fantasy, sci-fi mystery, etc.">
            </div>
            <div>
                <label for="person-type">Person Type</label>
                <br>
                <!-- <input type="text" name="person-type" value=""> -->
                <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
                    <input type="radio" class="btn-check" name="person-type" id="btnradio1" autocomplete="off" value="first person" checked>
                    <label class="btn btn-outline-primary" for="btnradio1">First Person</label>
                
                    <input type="radio" class="btn-check" name="person-type" id="btnradio2" autocomplete="off" value="second person">
                    <label class="btn btn-outline-primary" for="btnradio2">Second Person</label>
                
                    <input type="radio" class="btn-check" name="person-type" id="btnradio3" autocomplete="off" value="third person">
                    <label class="btn btn-outline-primary" for="btnradio3">Third Person</label>
                </div>
            </div>
            <div>
                <label for="creature">Creature</label>
                <br>
                <input type="text" name="creature" value="" placeholder="human, ogre, toad, etc.">
            </div>
            <div>
                <label for="name">Character Name</label>
                <br>
                <input type="name" name="name" value="">
            </div>
            <br>
            <button type="submit" class="begin-btn" onclick="loadingNotifier()">Begin your journey</button>
        </form>
        <p id="loading" class="loading"></p>
    </div>
    <script src="/static/js/start.js"></script>
</body>

</html>
