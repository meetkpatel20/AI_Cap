<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>AI GAME</title>
        <link href="{{ url_for('static', filename='styles/game.css') }}" rel="stylesheet" />

        <!-- Testiong bootstrap code from CS 120-->
        <!-- Bootstrap CDN Code: (I removed the integrity/anonymous attriutes)-->
        <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>

    <body>
        <div class="container">
            <h1>Chapter {{ title_head }}: {{ title_desc }}</h1>
            <h4>{{ body }}</h4>
            <form action="/game" method="post">
                <button type="button submit" class="btn btn-primary btn-lg button" name="choice-btn" value="{{ choice1 }}" onclick="loadingNotifier()"><b>{{ choice1[0] }}</b> <br>{{ choice1[1] }}</button>
                <button type="button submit" class="btn btn-primary btn-lg button" name="choice-btn" value="{{ choice2 }}" onclick="loadingNotifier()"><b>{{ choice2[0] }}</b> <br>{{ choice2[1] }}</button>
                <br>
                <button type="button submit" class="btn btn-primary btn-lg button" name="choice-btn" value="{{ choice3 }}" onclick="loadingNotifier()"><b>{{ choice3[0] }}</b> <br>{{ choice3[1] }}</button>
                <button type="button submit" class="btn btn-primary btn-lg button" name="choice-btn" value="{{ choice4 }}" onclick="loadingNotifier()"><b>{{ choice4[0] }}</b> <br>{{ choice4[1] }}</button>
            </form>
            <p id="loading" class="loading"></p>
        </div>
        <section class="image-side">
            <div>
                <h1>PLACEHOLDER</h1>
            </div>
        </section>
        <script src="/static/js/game.js"></script>
    </body>

</html>
