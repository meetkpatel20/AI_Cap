<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>AI GAME</title>
        <link href="{{ url_for('static', filename='styles/game.css') }}" rel="stylesheet" />
    </head>

    <body>
        <div class="container">
            <h1>Chapter {{ title_head }}: {{ title_desc }}</h1>
            <h4>{{ body }}</h4>
            <form action="/game" method="post">
                <button type="submit" name="choice-btn" value="{{ choice1 }}">{{ choice1 }}</button>
                <button type="submit" name="choice-btn" value="{{ choice2 }}">{{ choice2 }}</button>
                <button type="submit" name="choice-btn" value="{{ choice3 }}">{{ choice3 }}</button>
                <button type="submit" name="choice-btn" value="{{ choice4 }}">{{ choice4 }}</button>
            </form>
        </div>
        <section class="image-side">
            <div>
                <h1>PLACEHOLDER</h1>
            </div>
        </section>
    </body>

</html>
